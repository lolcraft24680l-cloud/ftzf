name: Build IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: App-Icon erzeugen
        run: python3 make_icon.py

      - name: XcodeGen installieren
        run: brew install xcodegen

      - name: Xcode-Projekt erzeugen
        run: xcodegen generate

      - name: Ohne Signatur bauen
        run: |
          xcodebuild \
            -project AURA.xcodeproj \
            -scheme AURA \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Zur IPA packen
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/AURA.app Payload/
          zip -qry AURA.ipa Payload
          ls -lh AURA.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: AURA-ipa
          path: AURA.ipa
          retention-days: 30
